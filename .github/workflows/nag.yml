# Pokes the nag endpoint every 25 minutes during UK waking hours.
# (Vercel Hobby crons only run daily, so the frequent job lives here.)
#
# Repo secrets required:
#   APP_URL      e.g. https://lockin-yourname.vercel.app
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
name: Study nags

on:
  schedule:
    # 07:00–21:59 UTC ≈ 08:00–22:59 UK in summer; the endpoint enforces
    # local quiet hours itself, so over-calling is harmless.
    - cron: "*/25 7-21 * * *"
  workflow_dispatch: {}

jobs:
  nag:
    runs-on: ubuntu-latest
    steps:
      - name: Call the nag endpoint
        run: |
          curl -sS -X POST "$APP_URL/api/cron/nag" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 30 --retry 2
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
